<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Dark Automate</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d1240"/>
      <stop offset="0.55" stop-color="#0c0a18"/>
      <stop offset="1" stop-color="#050507"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9a6ff"/>
      <stop offset="0.5" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#4523c9"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9ceff"/>
    </linearGradient>
  </defs>
  <!-- fundo -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="111.5" fill="none" stroke="#7c5cff" stroke-opacity="0.35" stroke-width="3"/>
  <circle cx="256" cy="256" r="210" fill="url(#glow)"/>
  <!-- engrenagem (automação): 10 dentes + aro -->
  <g fill="url(#gear)">
    <g id="tooth"><rect x="232" y="72" width="48" height="58" rx="10"/></g>
    <use href="#tooth" transform="rotate(36 256 256)"/>
    <use href="#tooth" transform="rotate(72 256 256)"/>
    <use href="#tooth" transform="rotate(108 256 256)"/>
    <use href="#tooth" transform="rotate(144 256 256)"/>
    <use href="#tooth" transform="rotate(180 256 256)"/>
    <use href="#tooth" transform="rotate(216 256 256)"/>
    <use href="#tooth" transform="rotate(252 256 256)"/>
    <use href="#tooth" transform="rotate(288 256 256)"/>
    <use href="#tooth" transform="rotate(324 256 256)"/>
    <circle cx="256" cy="256" r="148"/>
  </g>
  <!-- miolo escuro -->
  <circle cx="256" cy="256" r="112" fill="#0b0918"/>
  <circle cx="256" cy="256" r="112" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
  <!-- play (vídeo) -->
  <path d="M228 196 Q228 182 240 189 L318 241 Q330 249 318 257 L240 309 Q228 316 228 302 Z" fill="url(#play)"/>
</svg>
